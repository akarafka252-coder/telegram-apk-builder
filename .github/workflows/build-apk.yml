name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to the ZIP file'
        required: true
      id:
        description: 'Unique ID'
        required: true
      name:
        description: 'App Name'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      - name: Download ZIP
        run: |
          curl -L -o source.zip "${{ github.event.inputs.url }}"
          mkdir proj
          unzip -q source.zip -d proj
          cd proj

      - name: Build APK
        env:
          APPNAME: ${{ github.event.inputs.name }}
        run: |
          cd proj
          
          # Cek apakah proyek Flutter, Android, atau Web
          if [ ! -f pubspec.yaml ] && [ ! -d android ]; then
            echo "Bukan proyek Flutter/Android, mencoba setup Web..."
            flutter create . --platforms=android --project-name "app_web"
          elif [ ! -d android ]; then
            echo "Proyek Flutter tanpa folder Android, membuat folder Android..."
            flutter create . --platforms=android --project-name "$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')"
          fi

          # Ubah nama aplikasi di AndroidManifest
          M=android/app/src/main/AndroidManifest.xml
          if [ -f "$M" ]; then 
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APPNAME\"|" "$M"
          fi

          # PERBAIKAN 1: Hapus baris android.newDsl=false yang bermasalah
          touch android/gradle.properties
          
          # PERBAIKAN 2: Paksa upgrade Gradle ke versi 8.14.3 (minimal yang diminta Flutter)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

          flutter pub get
          
          # PERBAIKAN 3: Tambahkan bypass validation jaga-jaga
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          cd proj
          # Cari file APK dan ganti namanya
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec mv {} app-release.apk \;

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.event.inputs.id }}
          name: Build ${{ github.event.inputs.id }}
          body: |
            Tipe: flutter
            Aplikasi: ${{ github.event.inputs.name }}
          files: proj/app-release.apk