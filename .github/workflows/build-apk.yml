
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        id: detect
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
          elif [ -f gradlew ] || [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "Project Flutter/Gradle tidak ditemukan di root repository."
            exit 1
          fi

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        uses: android-actions/setup-android@v3

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Build Gradle APK
        if: steps.detect.outputs.type == 'gradle'
        uses: android-actions/setup-android@v3

      - name: Compile Gradle project
        if: steps.detect.outputs.type == 'gradle'
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Project memerlukan Gradle Wrapper gradlew."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasil-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
