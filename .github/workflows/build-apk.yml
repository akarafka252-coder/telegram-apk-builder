name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to the ZIP file'
        required: true
      id:
        description: 'Unique ID'
        required: true
      name:
        description: 'App Name'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download ZIP
        run: |
          curl -L -o source.zip "${{ github.event.inputs.url }}"
          mkdir proj
          unzip -q source.zip -d proj
          cd proj

      - name: Build APK
        env:
          APPNAME: ${{ github.event.inputs.name }}
        run: |
          cd proj
          
          # 1. Bikin folder android kalau belum ada
          if [ ! -f pubspec.yaml ] && [ ! -d android ]; then
            flutter create . --platforms=android --project-name "app_web"
          elif [ ! -d android ]; then
            flutter create . --platforms=android --project-name "$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')"
          fi

          # 2. Ubah nama aplikasi
          M=android/app/src/main/AndroidManifest.xml
          if [ -f "$M" ]; then 
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APPNAME\"|" "$M"
          fi

          # 3. Upgrade Gradle Wrapper biar gak error versi
          touch android/gradle.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

          # 4. JURUS ANTI ERROR ICONDATA: Paksa upgrade font_awesome_flutter
          if grep -q "font_awesome_flutter" pubspec.yaml; then
            echo "Memperbaiki library font_awesome_flutter..."
            sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^11.0.0/' pubspec.yaml
          fi

          # 5. Bersihkan dan Build
          flutter clean
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          cd proj
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec mv {} app-release.apk \;

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.event.inputs.id }}
          name: Build ${{ github.event.inputs.id }}
          body: |
            Tipe: flutter
            Aplikasi: ${{ github.event.inputs.name }}
          files: proj/app-release.apk