name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL zip project'
        required: true
      id:
        description: 'ID build'
        required: true
      name:
        description: 'Nama aplikasi'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download & ekstrak ZIP
        run: |
          curl -L --fail -o site.zip "${{ github.event.inputs.url }}"
          mkdir -p extract
          unzip -q site.zip -d extract
          PUB=$(find extract -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUB" ]; then echo "pubspec.yaml tidak ditemukan"; exit 1; fi
          mv "$(dirname "$PUB")" proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Kunci versi font_awesome_flutter
        run: |
          cd proj
          rm -f pubspec.lock
          sed -i -E 's/^(\s*font_awesome_flutter:).*/\1 10.9.1/' pubspec.yaml

      - name: Siapkan folder android
        run: |
          cd proj
          if [ ! -d android ]; then flutter create --platforms=android .; fi

      - name: Upgrade Gradle wrapper
        run: |
          F=proj/android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$F" ]; then
            sed -i -E 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#' "$F"
            cat "$F"
          fi

      - name: Upgrade Android Gradle Plugin
        run: |
          for F in proj/android/settings.gradle proj/android/settings.gradle.kts; do
            if [ -f "$F" ]; then
              sed -i -E 's/(com\.android\.application[^v]*version *)"[0-9.]+"/\1"8.11.1"/' "$F"
              grep -n "com.android" "$F" || true
            fi
          done
          if [ -f proj/android/build.gradle ]; then
            sed -i -E "s#(com\.android\.tools\.build:gradle:)[0-9.]+#\18.11.1#" proj/android/build.gradle
          fi

      - name: Build APK
        run: |
          cd proj
          flutter pub get
          flutter build apk --release

      - name: Upload ke Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find proj/build/app/outputs/flutter-apk -name "app-release.apk" | head -n 1)
          cp "$APK" "${{ github.event.inputs.name }}.apk"
          gh release create "build-${{ github.event.inputs.id }}" \
            "${{ github.event.inputs.name }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.event.inputs.name }}" \
            --notes "Tipe: Flutter"