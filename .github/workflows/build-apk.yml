name: Build Android APK
run-name: Build ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link download zip web'
        required: true
      id:
        description: 'ID build'
        required: true
      name:
        description: 'Nama aplikasi'
        required: false
        default: 'MyApp'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dan pasang web dari zip
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p dl
          if echo "$URL" | grep -q "drive.google.com"; then
            pip install -q gdown
            gdown --fuzzy "$URL" -O dl/site.zip
          else
            curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors -o dl/site.zip "$URL"
          fi
          rm -rf www
          mkdir www
          unzip -q dl/site.zip -d www
          if [ ! -f www/index.html ]; then
            sub=$(find www -mindepth 1 -maxdepth 1 -type d ! -name '__MACOSX' | head -n1)
            if [ -n "$sub" ]; then cp -r "$sub"/. www/; fi
          fi
          test -f www/index.html || (echo "index.html tidak ditemukan di zip" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Capacitor
        env:
          APPNAME: ${{ inputs.name }}
        run: |
          PKG="com.build.a$(date +%s)"
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APPNAME" "$PKG" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK ke Release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "app-$ID.apk"
          gh release create "build-$ID" "app-$ID.apk" --title "Build $ID" --notes "APK dari bot" --target "${{ github.sha }}"
