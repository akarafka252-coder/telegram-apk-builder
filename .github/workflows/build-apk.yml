name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL zip project'
        required: true
      id:
        description: 'ID build'
        required: true
      name:
        description: 'Nama aplikasi'
        required: true
      abi:
        description: 'Arsitektur (android-arm64 = cepat & kecil, android-arm,android-arm64 = support HP 32-bit)'
        required: false
        default: 'android-arm64'

permissions:
  contents: write

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download & ekstrak ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.url }}
        run: |
          curl -fL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o site.zip "$ZIP_URL"
          mkdir -p extract
          unzip -q site.zip -d extract
          rm -f site.zip
          PUB=$(find extract -name pubspec.yaml -not -path "*/.*" | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$PUB" ]; then echo "pubspec.yaml tidak ditemukan"; exit 1; fi
          mv "$(dirname "$PUB")" proj
          rm -rf extract
          # Buang sisa build dari komputer pembuat ZIP supaya tidak bentrok dengan versi di runner
          rm -rf proj/build proj/.dart_tool proj/android/.gradle proj/android/app/build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      # Cache Gradle (distribusi Gradle + library) dipakai ulang antar build
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # Setelan Gradle global (di ~/.gradle supaya mengalahkan gradle.properties project):
      # memori besar cegah OutOfMemory, parallel + caching percepat kompilasi
      - name: Atur Gradle
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.workers.max=4"
            echo "android.enableR8.fullMode=false"
          } >> ~/.gradle/gradle.properties

      - name: Kunci versi font_awesome_flutter
        run: |
          cd proj
          sed -i -E 's/^(\s*font_awesome_flutter:).*/\1 10.9.1/' pubspec.yaml

      - name: Siapkan folder android
        run: |
          cd proj
          if [ ! -d android ]; then flutter create --platforms=android .; fi

      # Coba dulu Flutter 3.35.7 (versi yang sudah terbukti cocok)
      - name: Pub get (Flutter 3.35.7)
        id: pub1
        continue-on-error: true
        run: |
          cd proj
          set -o pipefail
          flutter pub get 2>&1 | tee ../pub.log

      # Gagal karena paket butuh Dart lebih baru -> pindah ke Flutter stable terbaru
      - name: Cek perlu Flutter lebih baru
        id: perlu
        if: steps.pub1.outcome == 'failure'
        run: |
          if grep -qiE "version solving failed|requires SDK version|current Dart SDK version" pub.log; then
            echo "baru=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.perlu.outputs.baru == 'true'
        with:
          channel: stable
          cache: true

      - name: Pub get (Flutter stable terbaru)
        id: pub2
        if: steps.perlu.outputs.baru == 'true'
        run: |
          cd proj
          flutter --version
          flutter pub get

      # Kalau pub get gagal bukan karena versi, berhenti di sini dengan pesan jelas (bukan lanjut build sia-sia)
      - name: Pub get gagal
        if: steps.pub1.outcome == 'failure' && steps.perlu.outputs.baru != 'true'
        run: |
          echo "Pub get gagal. Detail:"
          cat pub.log
          exit 1

      # Nama langkah "Build APK" dipertahankan: bot membaca nama ini saat menampilkan penyebab gagal
      - name: Build APK
        env:
          ABI: ${{ github.event.inputs.abi }}
        run: |
          cd proj
          TARGET="${ABI:-android-arm64}"
          # --no-pub: pub get sudah jalan di atas (tidak diulang)
          # --no-tree-shake-icons: cegah gagal "cannot tree shake icons" pada project yang pakai IconData dinamis
          flutter build apk --release \
            --target-platform "$TARGET" \
            --no-pub \
            --no-tree-shake-icons

      - name: Upload ke Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ github.event.inputs.name }}
          BUILD_ID: ${{ github.event.inputs.id }}
        run: |
          APK=$(find proj/build/app/outputs/flutter-apk -name "app-release.apk" | head -n 1)
          if [ -z "$APK" ]; then APK=$(find proj/build/app/outputs -name "*.apk" | head -n 1); fi
          if [ -z "$APK" ]; then echo "APK tidak ditemukan setelah build"; exit 1; fi
          cp "$APK" "$APP_NAME.apk"
          gh release create "build-$BUILD_ID" \
            "$APP_NAME.apk" \
            --repo "${{ github.repository }}" \
            --title "Build $APP_NAME" \
            --notes "Tipe: Flutter"
