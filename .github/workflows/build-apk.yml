name: Build Android APK
on:
  push:
    paths:
      - 'incoming/site.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang web dari zip
        run: |
          if [ -f incoming/site.zip ]; then
            rm -rf www
            mkdir www
            unzip -q incoming/site.zip -d www
            if [ ! -f www/index.html ]; then
              sub=$(find www -mindepth 1 -maxdepth 1 -type d | head -n1)
              if [ -n "$sub" ]; then cp -r "$sub"/. www/; fi
            fi
          fi
          test -f www/index.html || (echo "index.html tidak ditemukan di zip" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init MyApp com.example.myapp --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
